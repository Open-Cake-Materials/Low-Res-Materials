name: Manual Clean ??p and Rename

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-and-rename:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean ??p directories
        shell: bash
        run: |
          shopt -s nullglob
          for dir in ??p; do
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 1 \( -type f -o -type l \) -delete
              echo "Cleaned: $dir"
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run rename script
        run: python scripts/rename_textures.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(textures): clean ??p directories and rename source images"
            git push
          fi
